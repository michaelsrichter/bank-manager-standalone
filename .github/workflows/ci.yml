name: CI

# eps-demo-repo-hygiene: lint -> build -> test with coverage gates.
# FAKE_AI=1 everywhere: CI never calls a real model (eps-demo-testing-solid).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FAKE_AI: '1'
  AGT_COMMIT: c07577d9785d4f64225a7b367cb2a978e9fc784d
  OPA_VERSION: v1.21.0

jobs:
  guidance-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills, agents, prompt routing, and Markdown links
        run: python3 tools/validate-guidance.py

  bicep-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep compiles
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - name: Rego unit tests
        run: opa test backend/governance/policy -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Cache ACS wheel (built from pinned source)
        id: acs-cache
        uses: actions/cache@v4
        with:
          path: .wheels
          key: acs-${{ runner.os }}-${{ env.AGT_COMMIT }}
      - name: Build ACS wheel
        if: steps.acs-cache.outputs.cache-hit != 'true'
        run: |
          pip wheel --no-deps -w .wheels \
            "git+https://github.com/microsoft/agent-governance-toolkit.git@${AGT_COMMIT}#subdirectory=policy-engine/sdk/python"
      - name: Install
        run: pip install .wheels/agent_control_specification-*.whl -r backend/requirements-dev.txt
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - name: Lint + format check
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Test with coverage (>= 70% per eps-demo-testing-solid)
        working-directory: backend
        run: ACS_OPA_PATH="$(command -v opa)" pytest
      - name: Policy regression eval (non-blocking)
        continue-on-error: true
        run: ACS_OPA_PATH="$(command -v opa)" python evals/policy_regression.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint (eslint + prettier + tsc)
        run: npm run lint
        working-directory: frontend
      - name: Test with coverage (>= 60% per eps-demo-testing-solid)
        run: npm run test:coverage
        working-directory: frontend
      - name: Build (includes served docs generation + validation)
        run: npm run build
        working-directory: frontend
