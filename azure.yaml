# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# `azd up` is the uniform `deploy` verb (eps-demo-devx / eps-demo-architecture).
# infra/main.bicep is subscription-scoped and creates its own resource group.
name: bank-manager-governance
metadata:
  template: eps-demos-template@0.1.0
infra:
  path: infra
  module: main
services:
  web:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
hooks:
  preprovision:
    posix:
      shell: sh
      run: infra/hooks/preprovision.sh
      interactive: false
      continueOnError: false
    windows:
      shell: pwsh
      run: infra/hooks/preprovision.ps1
      interactive: false
      continueOnError: false
  prepackage:
    # Stamp the colophon (commit, date, message) before the remote image build,
    # because the container build context has no .git folder.
    posix:
      shell: sh
      run: node frontend/scripts/build-info.mjs
      interactive: false
      continueOnError: false
    windows:
      shell: pwsh
      run: node frontend/scripts/build-info.mjs
      interactive: false
      continueOnError: false
